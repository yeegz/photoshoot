appId: com.photoshoot.app
productName: Photoshoot
copyright: Copyright © 2026 Photoshoot
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
# Installed copies update themselves from GitHub Releases (electron-updater
# reads latest.yml from the release). CI builds with --publish never and uploads
# latest.yml + the blockmap itself, after the packaged app is tested.
publish:
  - provider: github
    owner: yeegz
    repo: photoshoot
    releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Photoshoot
portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  category: public.app-category.photography
  extendInfo:
    NSCameraUsageDescription: Photoshoot uses your camera to take photos and videos on this device.
