name: Verify Photoshoot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  camera-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: camera-test-results
          path: test-results
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: photoshoot-windows
          path: release/*.exe
