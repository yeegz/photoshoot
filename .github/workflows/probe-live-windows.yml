name: Probe live site on Windows
# Renders the deployed web app's viewfinder on a Windows runner over ANGLE
# Direct3D 11 with GPU compositing (the path every Windows PC with a working
# GPU takes) and reads real pixels back from the preview, an effect and a
# saved photo. Run it after a deploy to confirm what Windows users actually see.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site origin to probe (no path)
        default: https://photoshoot-yeegz.web.app
        required: true
permissions:
  contents: read
jobs:
  viewfinder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render the live viewfinder and showcase on Direct3D 11 with GPU compositing
        run: npx playwright test test/browser/viewfinder.spec.ts test/browser/landing.spec.ts --project win-d3d11
        env:
          PHOTOSHOOT_BASE_URL: ${{ inputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-probe-results
          path: test-results
