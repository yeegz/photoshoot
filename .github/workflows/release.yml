name: Release Photoshoot
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run verify
  windows-release:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match package.json version' }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:win -- --publish never
      - run: npx playwright test test/browser/electron.spec.ts --project chromium
      - name: 'Verify the packaged app (app.asar) - camera, segmentation, update check'
        run: npx playwright test test/browser/electron.spec.ts --project chromium
        env:
          PHOTOSHOOT_EXE: release/win-unpacked/Photoshoot.exe
      - name: Verify the viewfinder renders on Windows Direct3D 11 with GPU compositing
        run: npx playwright test test/browser/viewfinder.spec.ts --project win-d3d11
      - name: Publish verified Windows packages and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem release -Filter '*.exe' | Sort-Object Name)
          if ($packages.Count -ne 2) { throw 'Expected installer and portable executable' }
          $lines = $packages | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
          # Auto-update feed: installed apps read latest.yml and download the installer (blockmap = smaller updates).
          $feed = @('release/latest.yml') + @(Get-ChildItem release -Filter '*-x64.exe.blockmap' | ForEach-Object { $_.FullName })
          foreach ($f in $feed) { if (-not (Test-Path $f)) { throw "Missing update feed file $f" } }
          if ((Select-String -Path release/latest.yml -Pattern "version: $((Get-Content package.json | ConvertFrom-Json).version)" -Quiet) -ne $true) { throw 'latest.yml version does not match' }
          gh release create $env:GITHUB_REF_NAME $packages.FullName release/SHA256SUMS.txt $feed --verify-tag --title "Photoshoot $env:GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
